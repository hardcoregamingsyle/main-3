[build-system]\nrequires = [\"hatchling>=1.18.0\", \"hatch-vcs>=0.3.0\"]\nbuild-backend = \"hatchling.build\"\n\n[project]\nname = \"moe-ultra-engine\"\nversion = \"1.0.0\"\ndescription = \"Ultra-memory-efficient MoE inference engine for running 2.4T parameter models on consumer hardware\"\nreadme = \"README.md\"\nrequires-python = \">=3.10,<3.13\"\nlicense = {text = \"MIT\"}\nauthors = [\n    {name = \"Thalamus Code Project\", email = \"dev@thalamus.ai\"}\n]\nmaintainers = [\n    {name = \"Engineering Team\", email = \"engineering@thalamus.ai\"}\n]\nclassifiers = [\n    \"Development Status :: 3 - Alpha\",\n    \"Intended Audience :: Developers\",\n    \"Intended Audience :: Science/Research\",\n    \"License :: OSI Approved :: MIT License\",\n    \"Operating System :: OS Independent\",\n    \"Programming Language :: Python :: 3.10\",\n    \"Programming Language :: Python :: 3.11\",\n    \"Programming Language :: Python :: 3.12\",\n    \"Programming Language :: Python :: Implementation :: CPython\",\n    \"Topic :: Scientific/Engineering :: Artificial Intelligence\",\n    \"Topic :: Scientific/Engineering :: Information Analysis\",\n    \"Topic :: Software Development :: Libraries :: Python Modules\",\n    \"Typing :: Typed\"\n]\nkeywords = [\"MoE\", \"Mixture-of-Experts\", \"LLM\", \"inference\", \"AI\", \"ML\", \"quantization\", \"GGUF\"]\n\ndependencies = [\n    \"torch>=2.1.0,<2.6.0\",\n    \"transformers>=4.35.0,<4.50.0\",\n    \"accelerate>=0.25.0,<0.35.0\",\n    \"numpy>=1.24.0,<2.2.0\",\n    \"scipy>=1.11.0,<1.15.0\",\n    \"fastapi>=0.104.0,<0.120.0\",\n    \"uvicorn[standard]>=0.24.0,<0.35.0\",\n    \"starlette>=0.27.0,<0.38.0\",\n    \"pydantic>=2.5.0,<2.12.0\",\n    \"pydantic-settings>=2.1.0,<2.8.0\",\n    \"gguf>=0.6.0\",\n    \"bitsandbytes>=0.41.0\",\n    \"safetensors>=0.4.0,<0.6.0\",\n    \"aiohttp>=3.9.0,<3.12.0\",\n    \"asyncio-throttle>=1.0.2\",\n    \"loguru>=0.7.0,<0.8.0\",\n    \"prometheus-client>=0.19.0,<0.22.0\",\n    \"pyyaml>=6.0.1,<6.1.0\",\n    \"python-dotenv>=1.0.0,<1.1.0\",\n    \"tqdm>=4.66.0,<4.68.0\",\n    \"rich>=13.7.0,<14.2.0\",\n    \"click>=8.1.0,<8.2.0\",\n    \"typing-extensions>=4.8.0,<4.13.0\",\n    \"sqlalchemy>=2.0.0,<2.1.0\",\n    \"aiosqlite>=0.19.0,<0.21.0\",\n    \"cryptography>=41.0.0,<45.0.0\",\n    \"python-jose[cryptography]>=3.3.0,<3.5.0\",\n]\n\n[project.optional-dependencies]\ndev = [\n    \"pytest>=7.4.0,<8.5.0\",\n    \"pytest-asyncio>=0.21.0,<0.26.0\",\n    \"pytest-cov>=4.1.0,<6.1.0\",\n    \"pytest-xdist>=3.3.0,<3.8.0\",\n    \"hypothesis>=6.88.0,<6.120.0\",\n    \"black>=23.11.0,<25.2.0\",\n    \"ruff>=0.1.0,<0.12.0\",\n    \"mypy>=1.7.0,<1.16.0\",\n    \"pre-commit>=3.5.0,<4.3.0\",\n    \"isort>=5.12.0,<6.1.0\",\n    \"pyright>=1.1.300,<1.1.400\",\n    \"vulture>=2.10,<2.15\",\n    \"bandit>=1.7.5,<1.9.0\",\n    \"safety>=2.3.0,<3.3.0\",\n]\ntest = [\n    \"pytest>=7.4.0,<8.5.0\",\n    \"pytest-asyncio>=0.21.0,<0.26.0\",\n    \"pytest-cov>=4.1.0,<6.1.0\",\n    \"pytest-mock>=3.12.0,<3.16.0\",\n    \"coverage[toml]>=7.3.0,<7.8.0\",\n    \"fakeredis>=2.19.0,<2.28.0\",\n    \"httpx>=0.25.0,<0.29.0\",\n]\ngpu = [\n    \"nvidia-cuda-runtime-cu12>=12.1.0\",\n    \"nvidia-cudnn-cu12>=8.9.0\",\n    \"nvidia-cublas-cu12>=12.1.0\",\n]\ncpu = [\n    \"torch>=2.1.0,<2.6.0\",\n]\nmonitoring = [\n    \"prometheus-fastapi-instrumentator>=6.1.0,<7.2.0\",\n    \"opentelemetry-api>=1.20.0,<1.30.0\",\n    \"opentelemetry-sdk>=1.20.0,<1.30.0\",\n    \"opentelemetry-exporter-prometheus>=0.41b0,<0.50b0\",\n]\n\n[project.scripts]\nmoe-cli = \"core.cli:main\"\nmoe-server = \"api.server:run_server\"\nmoe-benchmark = \"scripts.benchmark:run_benchmark\"\n\n[project.urls]\nHomepage = \"https://github.com/thalamus/moe-ultra-engine\"\nDocumentation = \"https://docs.thalamus.ai/moe-ultra\"\nRepository = \"https://github.com/thalamus/moe-ultra-engine.git\"\nIssues = \"https://github.com/thalamus/moe-ultra-engine/issues\"\nChangelog = \"https://github.com/thalamus/moe-ultra-engine/blob/main/CHANGELOG.md\"\n\n[tool.hatch.version]\npath = \"core/__init__.py\"\n\n[tool.hatch.build.targets.wheel]\npackages = [\"core\", \"api\", \"config\", \"scripts\", \"tests\"]\ninclude = [\"*.py\", \"*.yaml\", \"*.yml\", \"*.jsonl\"]\n\n[tool.hatch.build.targets.sdist]\nexclude = [\"__pycache__\", \".git\", \".venv\", \"node_modules\", \"dist\", \"build\"]\n\n[tool.pytest.ini_options]\nminversion = \"7.4\"\naddopts = \"-ra -q --strict-markers --tb=short\"\ntestpaths = [\"tests\"]\npython_files = [\"test_*.py\", \"*_test.py\"]\npython_classes = [\"Test*\"]\npython_functions = [\"test_*\"]\nmarkers = [\n    \"slow: marks tests as slow (deselect with '-m \\\"not slow\\\")\",\n    \"integration: marks tests as integration tests\",\n    \"e2e: marks tests as end-to-end tests\",\n    \"gpu: marks tests requiring GPU\",\n    \"unit: marks unit tests\",\n]\nfilterwarnings = [\n    \"error\",\n    \"ignore::DeprecationWarning\",\n    \"ignore::PendingDeprecationWarning\",\n    \"ignore::ResourceWarning\",\n]\n\n[tool.coverage.run]\nsource = [\"core\", \"api\", \"scripts\"]\nbranch = true\nomit = [\"tests/*\", \"*/__init__.py\", \"*/conftest.py\"]\n\n[tool.coverage.report]\nexclude_lines = [\n    \"pragma: no cover\",\n    \"def __repr__\",\n    \"raise AssertionError\",\n    \"raise NotImplementedError\",\n    \"if __name__ == .__main__.:\",\n    \"if TYPE_CHECKING:\",\n    \"@abstractmethod\",\n]\n\n[tool.mypy]\npython_version = \"3.11\"\nwarn_return_any = true\nwarn_unused_configs = true\ndisallow_untyped_defs = true\ndisallow_incomplete_defs = true\ncheck_untyped_defs = true\nno_implicit_optional = true\nwarn_redundant_casts = true\nwarn_unused_ignores = true\nstrict_equality = true\nextra_checks = true\n\n[[tool.mypy.overrides]]\nmodule = [\"tests.*\", \"scripts.*\"]\ndisallow_untyped_defs = false\n\n[tool.ruff]\nline-length = 100\ntarget-version = \"py311\"\nselect = [\n    \"E\",\n    \"W\",\n    \"F\",\n    \"I\",\n    \"B\",\n    \"C4\",\n    \"UP\",\n    \"S\",\n    \"RUF\",\n]\nignore = [\n    \"E501\",\n    \"S101\",\n    \"B008\",\n]\n\n[tool.ruff.isort]\nknown-first-party = [\"core\", \"api\", \"scripts\", \"config\"]\nforce-single-line = true\n\n[tool.black]\nline-length = 100\ntarget-version = [\"py310\", \"py311\", \"py312\"]\ninclude = '\\.pyi?$'\n\n[tool.pyright]\npythonVersion = \"3.11\"\ntypeCheckingMode = \"basic\"\nreportMissingImports = true\nreportMissingTypeStubs = false