[build-system]
requires = ["hatchling>=1.21.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[project]
name = "moe-ultra-engine"
version = "1.0.0"
description = "Ultra-memory-efficient MoE inference engine for running 2.4T parameter models on consumer hardware"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
authors = [
    {name = "Thalamus Code Project", email = "dev@thalamus.ai"}
]
maintainers = [
    {name = "Engineering Team", email = "engineering@thalamus.ai"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed"
]
keywords = ["moel", "llm", "inference", "quantization", "transformers"]

# Core dependencies - pinned with compatible ranges
dependencies = [
    # PyTorch ecosystem - main ML framework
    "torch>=2.0.0,<3.0.0",
    "torchvision>=0.15.0,<0.20.0",
    "torchaudio>=2.0.0,<2.5.0",
    
    # Hugging Face transformers - model loading and inference
    "transformers>=4.35.0,<4.45.0",
    "accelerate>=0.24.0,<0.35.0",
    "huggingface-hub>=0.19.0,<0.26.0",
    "safetensors>=0.4.0,<0.5.0",
    
    # Quantization for memory efficiency
    "bitsandbytes>=0.41.0,<0.45.0",
    "optimum>=1.14.0,<1.22.0",
    "optimum-quanto>=0.2.0,<0.3.0",
    
    # Numerical computing
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0,<1.14.0",
    "pandas>=2.0.0,<2.3.0",
    
    # API layer
    "fastapi>=0.104.0,<0.116.0",
    "uvicorn[standard]>=0.24.0,<0.32.0",
    "pydantic>=2.0.0,<2.10.0",
    "pydantic-settings>=2.0.0,<2.7.0",
    "python-multipart>=0.0.6,<0.1.0",
    
    # Async HTTP clients
    "aiohttp>=3.9.0,<3.11.0",
    "httpx>=0.25.0,<0.28.0",
    "httpx-sse>=0.3.0,<0.5.0",
    
    # Tensor operations and optimization
    "einops>=0.7.0,<0.9.0",
    "triton>=2.1.0,<3.0.0",
    "tensorly>=0.8.0,<0.9.0",
    
    # Configuration and utilities
    "python-dotenv>=1.0.0,<2.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "jinja2>=3.1.0,<3.2.0",
    "click>=8.1.0,<8.2.0",
    "rich>=13.0.0,<14.0.0",
    "typer>=0.9.0,<0.13.0",
    
    # Monitoring and observability
    "prometheus-client>=0.18.0,<0.22.0",
    "opentelemetry-api>=1.21.0,<1.28.0",
    "opentelemetry-sdk>=1.21.0,<1.28.0",
    "opentelemetry-exporter-otlp>=1.21.0,<1.28.0",
    
    # Caching and session management
    "redis>=5.0.0,<6.0.0",
    "aioredis>=2.0.0,<3.0.0",
    "cachetools>=5.3.0,<6.0.0",
    
    # Database ORM
    "sqlalchemy>=2.0.0,<2.1.0",
    "alembic>=1.12.0,<1.14.0",
    "asyncpg>=0.29.0,<0.31.0",
    
    # Logging
    "loguru>=0.7.0,<0.8.0",
    "structlog>=23.1.0,<25.0.0",
    
    # Serialization
    "orjson>=3.9.0,<4.0.0",
    "msgpack>=1.0.0,<2.0.0",
    
    # Security
    "cryptography>=41.0.0,<44.0.0",
    "itsdangerous>=2.1.0,<3.0.0",
    "python-jose[cryptography]>=3.3.0,<3.5.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0.0,<3.0.0",
    "torchvision>=0.15.0,<0.20.0",
    "bitsandbytes>=0.41.0,<0.45.0",
]
cpu = [
    "onnxruntime>=1.16.0,<1.20.0",
    "onnx>=1.15.0,<1.17.0",
]
monitoring = [
    "prometheus-client>=0.18.0,<0.22.0",
    "opentelemetry-api>=1.21.0,<1.28.0",
    "opentelemetry-sdk>=1.21.0,<1.28.0",
]
all = [
    "moe-ultra-engine[gpu]",
    "moe-ultra-engine[monitoring]",
]

[project.scripts]
moe-cli = "core.cli:cli"
moe-server = "core.server:run_server"
moe-benchmark = "scripts.benchmark:main"
moe-download = "scripts.download_model:main"
moe-quantize = "scripts.quantize_model:main"

[project.urls]
Homepage = "https://github.com/thalamus/moe-ultra-engine"
Documentation = "https://docs.thalamus.ai/moe-ultra"
Repository = "https://github.com/thalamus/moe-ultra-engine.git"
Changelog = "https://github.com/thalamus/moe-ultra-engine/blob/main/CHANGELOG.md"
Issues = "https://github.com/thalamus/moe-ultra-engine/issues"

[tool.hatch]
version.path = "__init__.py"

[tool.hatch.build]
only-packages = true
packages = ["core", "api", "db", "scripts"]
artifacts = ["*.so", "*.pyd"]

[tool.hatch.build.targets.wheel]
packages = ["core", "api", "db", "scripts"]

[tool.hatch.build.targets.sdist]
include = [
    "core/",
    "api/",
    "db/",
    "scripts/",
    "config/",
    "tests/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "ui/",
    "docker/",
    ".github/",
    "node_modules/",
    "__pycache__/",
    "*.egg-info/",
    ".env",
    ".env.*",
]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
features = ["all"]

[tool.hatch.envs.default.scripts]
test = "pytest tests/ -v --cov=core --cov=api --cov-report=xml --cov-report=html"
test-unit = "pytest tests/unit/ -v"
test-integration = "pytest tests/integration/ -v"
test-e2e = "pytest tests/e2e/ -v"
lint = "ruff check . && black --check . && mypy ."
format = "black . && ruff check --fix ."
type-check = "mypy ."
benchmark = "pytest tests/performance/ -v --benchmark-only"
docs = "mkdocs serve"

[tool.hatch.envs.test]
features = ["all"]
extra-dependencies = [
    "pytest>=7.4.0,<8.2.0",
    "pytest-cov>=4.1.0,<5.1.0",
    "pytest-asyncio>=0.21.0,<0.24.0",
    "pytest-xdist>=3.3.0,<3.7.0",
    "pytest-benchmark>=4.0.0,<5.1.0",
    "mock>=5.1.0,<6.0.0",
    "faker>=20.0.0,<26.0.0",
]

[tool.hatch.envs.lint]
installer = "pip"
detached = true
dependencies = [
    "black>=23.0.0,<25.0.0",
    "ruff>=0.1.0,<0.6.0",
    "mypy>=1.7.0,<1.12.0",
    "pytest>=7.4.0,<8.2.0",
]

[tool.hatch.envs.lint.scripts]
style = [
    "ruff check .",
    "black --check .",
]
typing = "mypy ."
full = [
    "style",
    "typing",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = "\\.pyi?$"
extend-exclude = "(tests/migrations/|.venv/)"

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "ASYNC",# flake8-async
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
]
ignore = [
    "ANN101",  # Missing type annotation for self in method
    "ANN102",  # Missing type annotation for cls in classmethod
    "D203",    # One blank line required before class docstring
    "D213",    # Multi-line docstring summary should start at second line
]

[tool.ruff.per-file-ignores]
"tests/*" = ["ANN", "S101"]
"scripts/*" = ["ANN"]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "gpu: marks tests requiring GPU",
    "benchmark: marks tests as benchmarks",
]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "ignore::DeprecationWarning:transformers.*",
    "ignore::DeprecationWarning:huggingface_hub.*",
]

[tool.coverage.run]
source = ["core", "api"]
branch = true
parallel = true
omit = [
    "tests/*",
    "scripts/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["core", "api", "db", "scripts"]
skip_glob = ["*/migrations/*", ".venv/*"]

[tool.bandit]
skips = ["B101", "B310", "B311"]
targets = ["core", "api"]
