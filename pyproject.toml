    "optuna>=3.5.0,<4.0.0",
    "hydra-core>=1.3.0,<2.0.0",
    "omegaconf>=2.3.0,<3.0.0",
    "loguru>=0.7.0,<1.0.0",
    "structlog>=24.1.0,<25.0.0",
    "colorama>=0.4.6,<1.0.0",
