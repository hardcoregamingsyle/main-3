[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moe-ultra-engine"
version = "1.0.0"
description = "Ultra-memory-efficient MoE inference engine for running large parameter models on consumer hardware"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Thalamus Code Project", email = "dev@thalamus.ai"}
]
maintainers = [
    {name = "Engineering Team", email = "engineering@thalamus.ai"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
keywords = ["mixture-of-experts", "mo-e", "inference", "machine-learning", "deep-learning", "llm", "quantization", "memory-efficient"]

dependencies = [
    # Core ML Frameworks
    "torch>=2.1.0",
    "transformers>=4.37.0",
    "accelerate>=0.26.0",
    
    # Data Processing & Numerical Computing
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    
    # Web Server & API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    
    # Validation & Serialization
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Model Loading & Quantization
    "safetensors>=0.4.0",
    "bitsandbytes>=0.41.0",
    "auto-gptq>=0.6.0",
    "llama-cpp-python>=0.2.0",
    
    # Memory Management
    "psutil>=5.9.0",
    "triton>=2.1.0; python_version >= \"3.10\"",
    
    # Logging & Monitoring
    "loguru>=0.7.0",
    "prometheus-client>=0.19.0",
    
    # Database
    "aiosqlite>=0.19.0",
    "sqlalchemy>=2.0.0",
    
    # Utilities
    "pyyaml>=6.0.1",
    "rich>=13.0.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "aiohttp>=3.9.0",
    "httpx>=0.26.0",
    
    # Security
    "bcrypt>=4.0.0",
    "cryptography>=41.0.0",
    "PyJWT>=2.8.0",
    
    # Testing Support (runtime)
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "ruff>=0.1.0",
    "pytest-xdist>=3.5.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings-python>=1.7.0",
    "pdoc>=3.4.0",
]
docker = [
    "docker>=7.0.0",
    "kubernetes>=28.0.0",
]
all = [
    "moe-ultra-engine[dev,docs,docker]",
]

[project.scripts]
moe-run = "core.cli:moe_run"
moe-server = "core.cli:moe_server"
moe-benchmark = "scripts.benchmark:main"
moe-quantize = "scripts.quantize_model:main"
moe-download = "scripts.download_model:main"
moe-convert = "scripts.convert_gguf:main"

[project.urls]
Homepage = "https://github.com/thalamus/moe-ultra-engine"
Documentation = "https://moe-ultra-engine.thalamus.ai"
Repository = "https://github.com/thalamus/moe-ultra-engine.git"
Issues = "https://github.com/thalamus/moe-ultra-engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["core", "api", "ui"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=moe_ultra_engine",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--verbose",
]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "gpu: Requires GPU hardware",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
strict_optional = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
mypy_path = "stubs"
show_error_codes = true

[[tool.mypy.overrides]]
module = ["transformers.*", "torch.*", "accelerate.*", "bitsandbytes.*", "llama_cpp.*"]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = "\\.pyi?$"
extend-exclude = "(?x)(\\.venv|\\.mypy_cache|__pycache__)"

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E", "F", "W", "C90",
    "I", "N", "UP", "S",
    "A", "B", "C", "DTZ",
    "T10", "YTT", "ERA",
    "EXE", "SIM", "RUF",
]
ignore = [
    "E501",  # Line length handled by black
    "S101",  # Use of assert allowed in tests
    "S105",  # Hardcoded passwords allowed in examples
]

[tool.coverage.run]
branch = true
source = ["moe_ultra_engine"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/cli.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
skip_covered = true
show_missing = true
