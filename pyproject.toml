[build-system]\nrequires = ["hatchling>=1.21.0", "hatch-vcs>=0.4.0"]\nbuild-backend = "hatchling.build"\n\n[project]\nname = "moe-ultra-engine"\nversion = "1.0.0"\ndescription = "Ultra-memory-efficient MoE inference engine for running 2.4T parameter models on consumer hardware"\nreadme = "README.md"\nrequires-python = ">=3.10,<3.13"\nlicense = {text = "MIT"}\nauthors = [\n    {name = "Thalamus Code Project", email = "dev@thalamus.ai"}\n]\nmaintainers = [\n    {name = "Engineering Team", email = "engineering@thalamus.ai"}\n]\nclassifiers = [\n    "Development Status :: 3 - Alpha",\n    "Intended Audience :: Developers",\n    "Intended Audience :: Science/Research",\n    "License :: OSI Approved :: MIT License",\n    "Operating System :: OS Independent",\n    "Programming Language :: Python :: 3",\n    "Programming Language :: Python :: 3.10",\n    "Programming Language :: Python :: 3.11",\n    "Programming Language :: Python :: 3.12",\n    "Topic :: Scientific/Engineering :: Artificial Intelligence"\n]\nkeywords = ["mixture-of-experts", "moel", "inference", "ml", "ai", "llm"]\n\ndependencies = [\n    "torch>=2.1.0,<3.0.0",\n    "transformers>=4.36.0,<5.0.0",\n    "accelerate>=0.25.0,<1.0.0",\n    "bitsandbytes>=0.41.0,<1.0.0",\n    "numpy>=1.24.0,<2.0.0",\n    "scipy>=1.11.0,<2.0.0",\n    "pandas>=2.0.0,<3.0.0",\n    "fastapi>=0.109.0,<1.0.0",\n    "uvicorn[standard]>=0.25.0,<1.0.0",\n    "pydantic>=2.5.0,<3.0.0",\n    "pydantic-settings>=2.1.0,<3.0.0",\n    "python-multipart>=0.0.6,<1.0.0",\n    "starlette>=0.35.0,<1.0.0",\n    "gguf>=0.6.0,<1.0.0",\n    "llama-cpp-python>=0.2.0,<1.0.0",\n    "optimum>=1.16.0,<2.0.0",\n    "onnxruntime>=1.16.0,<2.0.0",\n    "psutil>=5.9.0,<6.0.0",\n    "torchinfo>=1.8.0,<2.0.0",\n    "memory-profiler>=0.61.0,<1.0.0",\n    "pyyaml>=6.0.0,<7.0.0",\n    "structlog>=23.2.0,<25.0.0",\n    "python-json-logger>=2.0.0,<3.0.0",\n    "loguru>=0.7.0,<1.0.0",\n    "tqdm>=4.66.0,<5.0.0",\n    "requests>=2.31.0,<3.0.0",\n    "httpx>=0.26.0,<1.0.0",\n    "aiofiles>=23.2.0,<24.0.0",\n    "click>=8.1.0,<9.0.0",\n    "rich>=13.7.0,<14.0.0",\n    "typer>=0.9.0,<1.0.0",\n    "aiosqlite>=0.19.0,<1.0.0",\n    "redis>=5.0.0,<6.0.0",\n    "asyncpg>=0.29.0,<1.0.0",\n    "prometheus-client>=0.19.0,<1.0.0",\n    "opentelemetry-api>=1.21.0,<2.0.0",\n    "opentelemetry-sdk>=1.21.0,<2.0.0",\n    "cryptography>=41.0.0,<43.0.0",\n    "python-jose[cryptography]>=3.3.0,<4.0.0",\n    "passlib[bcrypt]>=1.7.0,<2.0.0",\n    "slowapi>=0.1.9,<1.0.0"\n]\n\n[project.optional-dependencies]\ndev = [\n    "pytest>=7.4.0,<8.0.0",\n    "pytest-asyncio>=0.21.0,<1.0.0",\n    "pytest-cov>=4.1.0,<5.0.0",\n    "pytest-xdist>=3.3.0,<4.0.0",\n    "hypothesis>=6.88.0,<7.0.0",\n    "black>=23.12.0,<24.0.0",\n    "ruff>=0.1.0,<1.0.0",\n    "mypy>=1.8.0,<2.0.0",\n    "pre-commit>=3.6.0,<4.0.0",\n    "isort>=5.13.0,<6.0.0",\n    "bandit>=1.7.0,<2.0.0",\n    "safety>=2.3.0,<3.0.0"\n]\n\nbenchmark = [\n    "hydra-core>=1.3.0,<2.0.0",\n    "ray[train,test]>=2.9.0,<3.0.0",\n    "wandb>=0.16.0,<1.0.0",\n    "tensorboard>=2.15.0,<3.0.0"\n]\n\ndocs = [\n    "mkdocs>=1.5.0,<2.0.0",\n    "mkdocs-material>=9.5.0,<10.0.0",\n    "mkdocstrings[python]>=0.24.0,<1.0.0",\n    "mike>=2.0.0,<3.0.0"\n]\n\ngpu = [\n    "nvidia-cuda-runtime-cu12>=12.1.0",\n    "nvidia-cudnn-cu12>=8.9.0",\n    "nvidia-cublas-cu12>=12.1.0"\n]\n\n[project.urls]\nHomepage = "https://github.com/thalamus/moe-ultra-engine"\nDocumentation = "https://docs.thalamus.ai/moe-ultra"\nRepository = "https://github.com/thalamus/moe-ultra-engine.git"\nIssues = "https://github.com/thalamus/moe-ultra-engine/issues"\nChangelog = "https://github.com/thalamus/moe-ultra-engine/blob/main/CHANGELOG.md"\n\n[project.scripts]\nmoe-ultra = "core.cli:main"\nmoe-benchmark = "scripts.benchmark:run"\nmoe-quantize = "scripts.quantize_model:main"\nmoe-download = "scripts.download_model:main"\nmoe-convert = "scripts.convert_gguf:main"\n\n[tool.hatch.version]\nsource = "vcs"\n\n[tool.hatch.build.targets.wheel]\npackages = ["core", "api", "scripts", "ui/components", "db"]\ninclude = [\n    "config/*.yaml",\n    "docker/*",\n    "tests/**/*"\n]\n\n[tool.hatch.build.targets.sdist]\nexclude = ["node_modules", "__pycache__", "*.pyc", ".git", ".env*"]\n\n[tool.hatch.envs.default]\ntype = "virtual"\nfeatures = ["dev"]\n\n[tool.hatch.envs.test]\ntype = "virtual"\nfeatures = ["dev", "gpu"]\n\n[tool.hatch.envs.benchmark]\ntype = "virtual"\nfeatures = ["benchmark", "gpu"]\n\n[tool.pytest.ini_options]\nminversion = "7.4"\naddopts = "-ra -q --strict-markers --cov=core --cov=api --cov-report=term-missing"\ntestpaths = ["tests"]\nmarkers = [\n    "unit: Unit tests",\n    "integration: Integration tests",\n    "e2e: End-to-end tests",\n    "gpu: GPU-requiring tests",\n    "slow: Slow-running tests",\n    "benchmark: Performance benchmarks"\n]\nfilterwarnings = [\n    "error::DeprecationWarning",\n    "ignore::PendingDeprecationWarning",\n    "ignore::ResourceWarning"\n]\n\n[tool.coverage.run]\nbranch = true\nparallel = true\nomit = [\n    "tests/*",\n    "scripts/*",\n    "*/__init__.py"\n]\n\n[tool.coverage.report]\nexclude_lines = [\n    "pragma: no cover",\n    "def __repr__",\n    "raise AssertionError",\n    "raise NotImplementedError",\n    "if __name__ == .__main__.:",\n    "if TYPE_CHECKING:",\n    "@abstractmethod"\n]\n\n[tool.black]\nline-length = 100\ntarget-version = ["py310", "py311", "py312"]\ninclude = "\\\\.pyi?$"\nextend-exclude = "(\\\\.eggs|\\\\.git|\\\\.hg|\\\\.mypy_cache|\\\\.tox|venv|_build|buck-out|build|dist)"\n\n[tool.ruff]\ntarget-version = "py310"\nline-length = 100\nselect = [\n    "E", "W",\n    "F",\n    "I",\n    "N",\n    "D",\n    "UP",\n    "S",\n    "B",\n    "C4",\n    "SIM",\n    "ARG",\n    "PTH",\n    "RUF"\n]\nignore = [\n    "D100",\n    "D104",\n    "D105",\n    "S101",\n    "B008",\n    "RUF012"\n]\n\n[tool.mypy]\npython_version = "3.10"\nwarn_return_any = true\nwarn_unused_configs = true\ndisallow_untyped_defs = true\ndisallow_incomplete_defs = true\ncheck_untyped_defs = true\ndisallow_untyped_decorators = true\nno_implicit_optional = true\nwarn_redundant_casts = true\nwarn_unused_ignores = true\nstrict_equality = true\nshow_error_codes = true\nignore_missing_imports = false\nplugins = ["pydantic.mypy"]\n\n[[tool.mypy.overrides]]\nmodule = ["tests.*", "scripts.*"]\ndisallow_untyped_defs = false\n\n[tool.isort]\nprofile = "black"\nline_length = 100\nknown_first_party = ["core", "api", "ui", "db", "scripts"]\nskip = ["node_modules", "__pycache__", ".venv", "venv"]\n\n[tool.bandit]\ntargets = ["core", "api"]\nskips = ["B101", "B603", "B607"]\nexclude_dirs = ["tests", "scripts"]\n\n[tool.safety]\nfull_report = true\nignore = []