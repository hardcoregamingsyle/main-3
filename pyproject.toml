[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moe-ultra-engine"
version = "1.0.0"
description = "Ultra-memory-efficient MoE inference engine for running large parameter models on consumer hardware"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Thalamus Code Project", email = "dev@thalamus.ai"}]
maintainers = [{name = "Engineering Team"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["moe", "inference", "llm", "memory-optimization", "fastapi"]

dependencies = [
    "fastapi>=0.109.0,<0.110.0",
    "uvicorn[standard]>=0.27.0,<0.28.0",
    "pydantic>=2.5.0,<2.6.0",
    "pydantic-settings>=2.1.0,<2.2.0",
    "numpy>=1.26.0,<1.27.0",
    "torch>=2.1.0,<2.2.0",
    "transformers>=4.37.0,<4.38.0",
    "accelerate>=0.26.0,<0.27.0",
    "sentencepiece>=0.1.99,<0.2.0",
    "protobuf>=4.25.0,<4.26.0",
    "httpx>=0.26.0,<0.27.0",
    "aiofiles>=23.2.0,<24.0.0",
    "psycopg2-binary>=2.9.0,<2.10.0",
    "alembic>=1.13.0,<1.14.0",
    "python-multipart>=0.0.6,<0.0.7",
    "pyyaml>=6.0.0,<6.1.0",
    "redis>=5.0.0,<5.1.0",
    "prometheus-client>=0.19.0,<0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "black>=24.1.0,<25.0.0",
    "ruff>=0.1.0,<0.2.0",
    "mypy>=1.8.0,<1.9.0",
    "pre-commit>=3.6.0,<3.7.0",
    "bandit>=1.7.0,<1.8.0",
    "safety>=2.3.0,<2.4.0",
]
ml = [
    "bitsandbytes>=0.42.0,<0.43.0",
    "peft>=0.8.0,<0.9.0",
    "safetensors>=0.4.0,<0.5.0",
]

[project.urls]
Homepage = "https://github.com/thalamus-project/moe-ultra-engine"
Documentation = "https://docs.moe-ultra.ai"
Repository = "https://github.com/thalamus-project/moe-ultra-engine.git"

[tool.hatch.build.targets.wheel]
packages = ["src", "api", "core", "db", "scripts"]

[tool.hatch.envs.default]
type = "virtual"
features = ["dev", "ml"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=core --cov=api --cov-report=term-missing"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]
