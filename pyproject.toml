[build-system]
requires = ["hatchling>=1.21.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[project]
name = "moe-ultra-engine"
version = "1.0.0"
description = "Ultra-memory-efficient MoE inference engine for running 2.4T parameter models on consumer hardware"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Thalamus Code Project", email = "dev@thalamus.ai"}
]
maintainers = [
    {name = "Engineering Team", email = "engineering@thalamus.ai"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
keywords = [
    "machine-learning",
    "deep-learning",
    "mixture-of-experts",
    "mo-e",
    "inference",
    "transformers",
    "llm",
    "large-language-models",
    "quantization",
    "memory-efficient"
]
dependencies = [
    "torch>=2.1.0,<3.0.0",
    "torchvision>=0.16.0,<0.20.0",
    "torchaudio>=2.1.0,<3.0.0",
    "transformers>=4.37.0,<5.0.0",
    "accelerate>=0.26.0,<1.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0,<2.0.0",
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.26.0,<1.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "safetensors>=0.4.0,<1.0.0",
    "sentencepiece>=0.2.0,<1.0.0",
    "protobuf>=4.25.0,<6.0.0",
    "tokenizers>=0.15.0,<1.0.0",
    "huggingface-hub>=0.20.0,<1.0.0",
    "pillow>=10.2.0,<11.0.0",
    "pandas>=2.1.0,<3.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "seaborn>=0.13.0,<1.0.0",
    "rich>=13.7.0,<14.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "click>=8.1.0,<9.0.0",
    "typer>=0.9.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "redis>=5.0.0,<6.0.0",
    "sqlalchemy>=2.0.25,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "aiosqlite>=0.19.0,<1.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "boto3>=1.34.0,<2.0.0",
    "aioboto3>=12.0.0,<13.0.0",
    "cryptography>=42.0.0,<43.0.0",
    "bcrypt>=4.1.0,<5.0.0",
    "pyjwt>=2.8.0,<3.0.0",
    "argon2-cffi>=23.1.0,<24.0.0",
    "httpx-sse>=0.4.0,<1.0.0",
