[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moe-ultra-engine"
version = "1.0.0"
description = "Ultra-memory-efficient MoE inference engine for running large parameter models on consumer hardware"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Thalamus Code Project", email = "dev@thalamus.ai"}
]
maintainers = [
    {name = "Engineering Team", email = "engineering@thalamus.ai"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "mixture-of-experts",
    "moa",
    "inference",
    "machine-learning",
    "transformers",
    "llm",
    "optimization",
]
dependencies = [
    # Core ML Framework
    "torch>=2.1.0,<3.0.0",
    "transformers>=4.36.0,<5.0.0",
    "accelerate>=0.25.0,<1.0.0",
    
    # Numerical Computing
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0,<2.0.0",
    
    # API Layer
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.25.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    
    # Model Optimization
    "bitsandbytes>=0.41.0,<1.0.0",
    "optimum>=1.16.0,<2.0.0",
    "onnxruntime>=1.16.0,<2.0.0",
    
    # Utilities
    "python-dotenv>=1.0.0,<2.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "click>=8.1.0,<9.0.0",
    "rich>=13.7.0,<14.0.0",
    "tqdm>=4.66.0,<5.0.0",
    
    # Monitoring
    "prometheus-client>=0.19.0,<1.0.0",
    "structlog>=24.1.0,<25.0.0",
    
    # Database (if needed for conversation storage)
    "sqlalchemy>=2.0.0,<3.0.0",
    "aiosqlite>=0.19.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0,<8.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    
    # Type Checking
    "mypy>=1.8.0,<2.0.0",
    "types-pyyaml>=6.0.0,<7.0.0",
    "types-requests>=2.31.0,<3.0.0",
    
    # Linting
    "ruff>=0.1.0,<1.0.0",
    "black>=23.12.0,<24.0.0",
    
    # Pre-commit hooks
    "pre-commit>=3.6.0,<4.0.0",
    
    # Documentation
    "sphinx>=7.2.0,<8.0.0",
    "sphinx-rtd-theme>=2.0.0,<3.0.0",
]

profiling = [
    "memory-profiler>=0.61.0,<1.0.0",
    "line-profiler>=4.1.0,<5.0.0",
    "viztracer>=0.15.0,<1.0.0",
]

gpu = [
    "cuda-python>=12.0.0,<13.0.0; platform_system == 'Linux'",
]

[project.scripts]
moe-cli = "core.cli:main"
moe-server = "api.main:run_server"
moe-benchmark = "scripts.benchmark:run_benchmark"

[project.urls]
Homepage = "https://github.com/thalamus-ai/moe-ultra-engine"
Documentation = "https://thalamus-ai.github.io/moe-ultra-engine"
Repository = "https://github.com/thalamus-ai/moe-ultra-engine.git"
Issues = "https://github.com/thalamus-ai/moe-ultra-engine/issues"
Changelog = "https://github.com/thalamus-ai/moe-ultra-engine/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "scripts", "tests", "ui", "db", "config"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".git",
    ".github",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    ".mypy_cache",
    "venv",
    ".venv",
    "node_modules",
    ".DS_Store",
    "*.egg-info",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = false
show_error_codes = true
pretty = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # Line too long
    "B008",  # Do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["api", "core", "config", "scripts", "tests"]
force-sort-within-sections = true

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(\n    \.eggs\n    | \.git\n    | \.hg\n    | \.mypy_cache\n    | \.tox\n    | \.venv\n    | _build\n    | buck-out\n    | build\n    | dist\n)/
'''

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests",
]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["api", "core", "scripts"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B104"]

# End of pyproject.toml