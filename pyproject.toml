[project]
name = "moe-ultra-engine"
version = "1.0.0"
description = "Ultra-memory-efficient MoE inference engine for running 2.4T parameter models on consumer hardware"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Thalamus Code Project"}]
keywords = ["moe", "inference", "llm", "airllm", "quantization", "offloading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26.0",
    "torch>=2.3.0",
    "transformers>=4.40.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "accelerate>=0.29.0",
    "safetensors>=0.4.2",
    "huggingface-hub>=0.22.0",
    "tokenizers>=0.15.0",
    "psutil>=5.9.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "aiofiles>=23.2.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "black>=24.0.0",
    "pre-commit>=3.6.0",
]
quantization = [
    "bitsandbytes>=0.43.0",
    "auto-gptq>=0.7.0",
    "awq>=0.1.0",
]
cuda = [
    "flash-attn>=2.5.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "api*", "ui*", "tests*", "config*", "scripts*", "db*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "W", "ANN", "ARG", "PTH", "ERA", "PL", "TRY", "NPY", "PD", "RET", "RUF", "TCH", "EXE", "ISC", "ICN", "PIE", "TID", "QL", "RSE", "FA", "LOG"]
ignore = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ARG001", "ARG002", "B008", "C901", "ERA001", "EXE005", "FA100", "ISC001", "NPY002", "PD011", "PD013", "PIE796", "PLR0913", "PLR0915", "PLW0602", "RET503", "RUF012", "S101", "S113", "S311", "S603", "S607", "T201", "T203", "TCH001", "TCH003", "TRY003", "UP007", "UP035"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "fastapi.*", "pydantic.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
/(\.git
| \.hg
| \.mypy_cache
| \.tox
| \.venv
| _build
| buck-out
| build
| dist
)/
'''
