[build-system]
requires = ["hatchling>=1.21.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[project]
name = "moe-ultra-engine"
version = "1.0.0"
description = "Ultra-memory-efficient MoE inference engine for running 2.4T parameter models on consumer hardware"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
authors = [
    {name = "Thalamus Code Project", email = "dev@thalamus.ai"}
]
maintainers = [
    {name = "Engineering Team", email = "engineering@thalamus.ai"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
keywords = [
    "mixture-of-experts",
    "mo-e",
    "llm-inference",
    "large-language-models",
    "machine-learning",
    "deep-learning",
    "inference-engine",
    "quantization",
    "gpu-computing"
]

[project.urls]
Homepage = "https://github.com/thalamus-ai/moe-ultra-engine"
Documentation = "https://docs.thalamus.ai/moe-ultra-engine"
Repository = "https://github.com/thalamus-ai/moe-ultra-engine.git"
Issues = "https://github.com/thalamus-ai/moe-ultra-engine/issues"
Changelog = "https://github.com/thalamus-ai/moe-ultra-engine/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.1.0",
    "isort>=5.13.2",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "pre-commit>=3.6.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
    "pip-audit>=2.6.0"
]
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=3.0.0"
]
docker = [
    "docker>=7.0.0"
]

[project.scripts]
moe-run = "core.cli:moe_run"
moe-benchmark = "scripts.benchmark:main"
moe-convert = "scripts.convert_gguf:convert_model"
moe-download = "scripts.download_model:download_model"
moe-quantize = "scripts.quantize_model:quantize_model"

[tool.hatch]
version.source = "vcs"
build.targets.sdist = true
build.targets.wheel = true

[tool.hatch.build]
include = ["core/", "api/", "scripts/"]
exclude = ["tests/", ".gitignore", "*.md"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.envs.default]
detached = true
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",
    "transformers>=4.39.0",
    "accelerate>=0.27.0",
    "safetensors>=0.4.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.12.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "requests>=2.31.0",
    "aiofiles>=23.2.0",
    "asyncio>=3.4.3",
    "tenacity>=8.2.0",
    "tqdm>=4.66.0",
    "tiktoken>=0.5.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "onnxruntime>=1.16.0",
    "onnx>=1.15.0",
    "triton>=2.1.0",
    "bitsandbytes>=0.42.0",
    "deepspeed>=0.14.0",
    "peft>=0.8.0",
    "datasets>=2.17.0",
    "huggingface-hub>=0.21.0",
    "flash-attn>=2.5.0",
    "causal-conv1d>=1.3.0",
    "mamba-ssm>=2.2.0",
    "jinja2>=3.1.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "typer>=0.9.0",
    "loguru>=0.7.0"
]

[tool.hatch.envs.test]
detached = true
dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "pytest-mock>=3.14.0",
    "hypothesis>=6.99.0",
    "faker>=23.0.0"
]

[tool.hatch.envs.lint]
detached = true
python = ".dev"
dependencies = [
    "black>=24.1.0",
    "isort>=5.13.2",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "pre-commit>=3.6.0",
    "bandit>=1.7.0",
    "safety>=2.3.0"
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["core", "api", "scripts", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "D",        # pydocstyle
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "ARG",      # flake8-unused-arguments
    "PTH",      # flake8-use-pathlib
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line too long (handled by black)
    "D100",     # public module docstring
    "D104",     # public package docstring
    "D105",     # magic method docstring
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
follow_imports = "normal"
silent_imports = false
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=. --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "slow: slow running tests",
    "ml: machine learning specific tests"
]

[tool.coverage.run]
source = ["core", "api", "scripts"]
object = ["core", "api"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
    "*/migrations/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod"
]
fail_under = 80
show_missing = true

[tool.pylint.MASTER]
jobs = 0
persistent = yes
extension-pkg-whitelist = ["numpy", "torch", "transformers"]

[tool.pylint.FORMAT]
max-line-length = 100

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "duplicate-code",
    "too-few-public-methods",
    "too-many-arguments",
    "logging-fstring-interpolation"
]

[tool.pylint.DESIGN]
min-public-methods = 1
max-args = 10
max-attributes = 10
