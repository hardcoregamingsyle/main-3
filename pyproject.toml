[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moe-ultra-engine"
version = "1.0.0"
description = "Ultra-memory-efficient MoE inference engine for running large parameter models on consumer hardware"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Thalamus Code Project", email = "dev@thalamus.ai"}
]
maintainers = [
    {name = "Engineering Team", email = "engineering@thalamus.ai"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
keywords = ["mixture-of-experts", "moef","llm","inference","quantization","gguf"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8>=6.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "pre-commit>=3.6.0"
]
testing = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "respx>=0.21.0"
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.0.0"
]
ml-inference = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.1.99",
    "protobuf>=4.25.0",
    "onnxruntime>=1.16.0",
    "bitsandbytes>=0.41.0",
    "auto-gptq>=0.6.0",
    "optimum>=1.16.0",
    "flash-attn>=2.5.0",
    "triton>=2.2.0"
]
fastapi = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6"
]
gpu-support = [
    "cuda-python>=12.3.0",
    "nvidia-cublas-cu12>=12.1.0",
    "nvidia-cudnn-cu12>=8.9.0"
]
all = [
    "moe-ultra-engine[ml-inference]",
    "moe-ultra-engine[fastapi]",
    "moe-ultra-engine[gpu-support]",
    "moe-ultra-engine[dev]"
]

[project.scripts]
moe-ultra = "core.cli:main"
download-model = "scripts.download_model:main"
convert-gguf = "scripts.convert_gguf:main"
quantize-model = "scripts.quantize_model:main"
benchmark = "scripts.benchmark:main"

[project.urls]
Homepage = "https://github.com/thalamus/moe-ultra-engine"
Documentation = "https://github.com/thalamus/moe-ultra-engine#readme"
Repository = "https://github.com/thalamus/moe-ultra-engine.git"
Issues = "https://github.com/thalamus/moe-ultra-engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["*.yaml","*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py","*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E","F","W","B","C4","UP","SIM","RUF"]
ignore = ["E501","B008","SIM115"]
exclude = ["__pycache__","build","dist",".git","venv",".venv"]

[tool.black]
line-length = 100
target-version = ["py310","py311","py312"]
include = "\\.pyi?$"
exclude = "\\.git|__pycache__|build|dist|venv"

[tool.isort]
profile = "black"
line_length = 100
skip = ["__pycache__","venv",".venv","build","dist"]

[tool.coverage.run]
source = ["."]
object_branches = true
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == \"__main__\":"
]
show_missing = true
