[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-timeout>=2.3.0,<3.0.0",
    "pytest-rerunfailures>=13.0,<14.0",
    "black>=24.1.0,<25.0.0",
    "isort>=5.13.2,<6.0.0",
    "flake8>=7.0.0,<8.0.0",
    "mypy>=1.8.0,<2.0.0",
    "pyright>=1.1.350,<2.0.0",
    "ruff>=0.3.0,<1.0.0",
    "pre-commit>=3.6.0,<4.0.0",
    "bandit>=1.7.0,<2.0.0",
    "safety>=2.3.0,<3.0.0",
    "pip-audit>=2.7.0,<3.0.0",
    "gprofiler>=3.0.0,<4.0.0",
    "memray>=1.12.0,<2.0.0",
    "py-spy>=0.3.14,<1.0.0",
    "line-profiler>=4.1.0,<5.0.0",
    "cProfile-view>=3.0.0,<4.0.0",
    "memory-profiler>=0.61.0,<1.0.0",
    "tracemalloc-utils>=0.1.0,<1.0.0",
    "jupyter>=1.0.0,<2.0.0",
    "notebook>=7.0.0,<8.0.0",
    "ipykernel>=6.29.0,<7.0.0",
    "nbconvert>=7.16.0,<8.0.0",
    "papermill>=2.5.0,<3.0.0"
]

[project.urls]
Homepage = "https://github.com/thalamus/moe-ultra-engine"
Documentation = "https://github.com/thalamus/moe-ultra-engine#readme"
Repository = "https://github.com/thalamus/moe-ultra-engine"
Issues = "https://github.com/thalamus/moe-ultra-engine/issues"
Changelog = "https://github.com/thalamus/moe-ultra-engine/releases"

[project.scripts]
moe-run = "core.cli:main"
moe-benchmark = "scripts.benchmark:main"
moe-download = "scripts.download_model:main"
moe-quantize = "scripts.quantize_model:main"
moe-convert = "scripts.convert_gguf:main"

[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "moe_ultra_engine/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["core", "api", "ui"]
include = ["*.yaml", "*.yml", "*.sql", "*.sh", "*.md"]

[tool.hatch.build.targets.sdist]
exclude = ["tests", ".github", ".vscode", ".idea"]

[tool.hatch.envs.default]
type = "virtual"
features = ["dev"]
python = "3.11"
dependencies = [
    "moe-ultra-engine[dev]"
]

[tool.hatch.envs.test]
type = "virtual"
features = ["dev"]
python = "3.11"
dependencies = [
    "moe-ultra-engine[dev]"
]

[tool.hatch.envs.lint]
type = "virtual"
features = ["dev"]
python = "3.11"
dependencies = [
    "moe-ultra-engine[dev]",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "black>=24.1.0"
]

[tool.hatch.envs.docs]
type = "virtual"
features = ["dev"]
python = "3.11"
dependencies = [
    "moe-ultra-engine[dev]",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0"
]

[tool.hatch.envs.types]
type = "virtual"
features = ["dev"]
python = "3.11"
dependencies = [
    "moe-ultra-engine[dev]",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.12",
    "types-aiofiles>=23.2.0",
    "types-ujson>=5.9.0",
    "types-orjson>=3.9.0"
]

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E", "W",  # pycodestyle
    "F",       # Pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "D",       # pydocstyle
    "ANN",     # flake8-annotations
    "ASYNC",   # flake8-async
    "S",       # flake8-bandit
    "SIM",     # flake8-simplify
    "TID",     # flake8-tidy-imports
    "ARG",     # flake8-unused-arguments
    "PTH",     # flake8-use-pathlib
    "RUF",     # ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by black)
    "D100",    # public module docstring missing
    "D104",    # public package docstring missing
    "ANN101",  # type annotation for self
    "ANN102",  # type annotation for cls
]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["ANN", "D", "S101"]
"scripts/**/*.py" = ["S603", "S607"]

[tool.ruff.isort]
known-first-party = ["core", "api", "ui", "tests"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.flake8-annotations]
suppress-none-returning = true
allow-untyped-defs = false
allow-overload = true

[tool.mypy]
python-version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_reexport = true
warn_unreachable = true
glob = ["core/*.py", "api/*.py", "scripts/*.py"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short --cov=core --cov=api --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "unit: marks tests as unit tests",
    "gpu: marks tests requiring GPU",
]

[tool.coverage.run]
source = ["core", "api"]
object = "./coverage"
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
skip_covered = true

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["**/__pycache__/**", "**/.venv/**", "**/node_modules/**"]

[tool.pylint.MASTER]
extension-pkg-whitelist = ["numpy", "torch", "safetensors", "orjson"]
ignore = ["migrations", "__pycache__", "build", "dist"]
persistent = true
jobs = 0

[tool.pylint.FORMAT]
max-line-length = 100

[tool.pylint.MESSAGES CONTROL]
disable = [
    "too-few-public-methods",
    "duplicate-code",
    "too-many-arguments",
    "too-many-locals",
]

[tool.pylint.DESIGN]
max-args = 10
max-attributes = 15
max-branches = 20
max-returns = 8
max-statements = 50
max-module-members = 200

[tool.uv]
optimize-for-deploy = true
extra-index-url = [
    "https://download.pytorch.org/whl/cu121",
]
