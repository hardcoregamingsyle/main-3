[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moe-ultra-engine"
version = "1.0.0"
description = "Ultra-memory-efficient MoE inference engine for running large parameter models on consumer hardware"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Thalamus Code Project", email = "dev@thalamus.ai"}]
maintainers = [{name = "Engineering Team"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
]
keywords = ["mixture-of-experts", "mo-e", "llm", "inference", "memory-efficient", "quantization"]

[project.urls]
Homepage = "https://github.com/thalamus/moe-ultra-engine"
Documentation = "https://github.com/thalamus/moe-ultra-engine#readme"
Repository = "https://github.com/thalamus/moe-ultra-engine.git"
Issues = "https://github.com/thalamus/moe-ultra-engine/issues"

[project.optional-dependencies]
full = [
    "accelerate>=0.27.0",
    "bitsandbytes>=0.42.0",
    "peft>=0.8.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "onnxruntime>=1.16.0",
]
gpu = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "torchaudio>=2.3.0",
]
cpu = [
    "torch==2.3.0+cpu",
    "torchvision==0.18.0+cpu",
    "--extra-index-url https://download.pytorch.org/whl/cpu",
]
ci = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
    "coverage[toml]>=7.4.0",
]
dev = [
    "black>=24.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "isort>=5.13.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
    "pip-tools>=7.4.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings-python>=1.9.0",
    "pymdown-extensions>=10.5.0",
]
all = [
    "moe-ultra-engine[full,gpu,ci,dev,docs]",
]

[project.scripts]
moe-run = "core.cli:main"
moe-benchmark = "scripts.benchmark:main"
moe-convert = "scripts.convert_gguf:convert_to_onnx"
moe-quantize = "scripts.quantize_model:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "api", "scripts"]

[tool.hatch.build.exclude]
"tests" = true
"docker" = true
"ui" = true
.github = true

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(\
    __pycache__ |
    venv |
    .git |
    migrations |
)
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
follow_imports = "normal"
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["numpy.*", "transformers.*", "torch.*", "fastapi.*", "pydantic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=core --cov=api --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
branch = true
source = ["core", "api"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/site-packages/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
precision = 2
show_missing = true
skip_empty = true

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["core", "api", "scripts"]
known_third_party = ["numpy", "torch", "transformers", "fastapi", "pydantic", "uvicorn"]

[tool.pre-commit]
repos = [
    {
        repo = "https://github.com/pre-commit/pre-commit-hooks",
        rev = "v4.5.0",
        hooks = [
            {id = "trailing-whitespace"},
            {id = "end-of-file-fixer"},
            {id = "check-yaml"},
            {id = "check-json"},
            {id = "check-added-large-files", "args": ["--maxkb=10000"]},
        ],
    },
    {
        repo = "https://github.com/astral-sh/ruff-pre-commit",
        rev = "v0.3.0",
        hooks = [{id = "ruff", "args": ["--fix"]}],
    },
    {
        repo = "https://github.com/psf/black",
        rev = "24.1.0",
        hooks = [{id = "black", "additional_dependencies": []}],
    },
    {
        repo = "https://github.com/python/mypy",
        rev = "v1.8.0",
        hooks = [{id = "mypy", "additional_dependencies": []}],
    },
]

[tool.uv]
optimize-package-data = true
emit-warnings = true

[dependency-groups]
development = [
    "moe-ultra-engine[dev]",
    "moe-ultra-engine[ci]",
]
production = [
    "moe-ultra-engine[full]",
    "moe-ultra-engine[gpu]",
]
testing = [
    "moe-ultra-engine[ci]",
    "moe-ultra-engine[dev]",
]
docs_group = [
    "moe-ultra-engine[docs]",
]
