# ================================================================
# MoE Ultra Engine - Docker Compose Configuration
# Local development and production orchestration
# ================================================================

version: "3.9"

services:
  # ----------------------------------------------------------------
  # Main Application Service
  # ----------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    container_name: moe-ultra-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount persistent data directories
      - ../data:/app/data:rw
      - ../logs:/app/logs:rw
      - ../models:/app/models:ro
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=4
      - DATABASE_URL=sqlite:////app/data/conversations.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    env_file:
      - ../.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - moe-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 32G
          cpus: '8'
        reservations:
          memory: 16G
          cpus: '4'

  # ----------------------------------------------------------------
  # Redis Cache Service
  # ----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: moe-ultra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    networks:
      - moe-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------
  # Prometheus Metrics Service
  # ----------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: moe-ultra-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - moe-network
    profiles:
      - monitoring

  # ----------------------------------------------------------------
  # Grafana Visualization Service
  # ----------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.0
    container_name: moe-ultra-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=changeme
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - moe-network
    depends_on:
      - prometheus
    profiles:
      - monitoring

  # ----------------------------------------------------------------
  # Development Helper Service (optional)
  # ----------------------------------------------------------------
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    container_name: moe-ultra-dev
    volumes:
      - ../:/app:rw
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
    working_dir: /app
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true
    networks:
      - moe-network
    profiles:
      - dev

networks:
  moe-network:
    driver: bridge
    name: moe-ultra-network

volumes:
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ================================================================
# Usage Instructions:
#
# Production (with monitoring):
#   docker-compose -f docker/docker-compose.yml --profile monitoring up -d
#
# Development:
#   docker-compose -f docker/docker-compose.yml --profile dev up
#
# View logs:
#   docker-compose -f docker/docker-compose.yml logs -f app
#
# Stop all services:
#   docker-compose -f docker/docker-compose.yml down
#
# Rebuild after code changes:
#   docker-compose -f docker/docker-compose.yml build --no-cache app
# ================================================================

# End of docker-compose.yml